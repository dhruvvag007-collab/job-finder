<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JobFinder</title>
<style>
    :root{
        --blue-600:#2563eb; --blue-700:#1d4ed8; --blue-50:#eff6ff; --blue-200:#bfdbfe;
        --slate-50:#f8fafc; --slate-100:#f1f5f9; --slate-200:#e2e8f0; --slate-300:#cbd5e1;
        --slate-400:#94a3b8; --slate-500:#64748b; --slate-600:#475569; --slate-700:#334155;
        --slate-800:#1e293b; --slate-900:#0f172a; --slate-950:#020617;
        --emerald-50:#ecfdf5; --emerald-600:#059669;
        --amber-50:#fffbeb; --amber-500:#f59e0b; --amber-600:#d97706;
        --violet-50:#f5f3ff; --violet-600:#7c3aed;
        --rose-50:#fff1f2; --rose-500:#f43f5e; --rose-600:#e11d48;
        --radius:14px;
    }
    *{box-sizing:border-box;}
    body{
        margin:0; min-height:100vh;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        background:var(--slate-50); color:var(--slate-900);
        transition:background .15s,color .15s;
    }
    body.dark{ background:var(--slate-950); color:var(--slate-100); }

    a,button,input,select{ font-family:inherit; }
    button{ cursor:pointer; }

    /* ---- layout helpers ---- */
    .center-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .auth-card{ width:100%; max-width:380px; background:#fff; border:1px solid var(--slate-200); border-radius:16px; box-shadow:0 1px 2px rgba(0,0,0,.04); padding:28px; }
    .container{ max-width:1152px; margin:0 auto; padding:32px; }
    .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .grid-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
    .grid-5{ display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
    .flex{ display:flex; }
    .flex-col{ display:flex; flex-direction:column; }
    .items-center{ align-items:center; }
    .justify-between{ display:flex; justify-content:space-between; }
    .gap-2{ gap:8px; } .gap-3{ gap:12px; } .gap-4{ gap:16px; }
    .mt-1{ margin-top:4px; } .mt-2{ margin-top:8px; } .mt-3{ margin-top:12px; } .mt-4{ margin-top:16px; } .mt-6{ margin-top:24px; }
    .mb-1{ margin-bottom:4px; } .mb-2{ margin-bottom:8px; } .mb-3{ margin-bottom:12px; } .mb-4{ margin-bottom:16px; } .mb-5{ margin-bottom:20px; } .mb-6{ margin-bottom:24px; } .mb-7{ margin-bottom:28px; }
    .w-full{ width:100%; }
    .text-center{ text-align:center; }
    .truncate{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .hidden{ display:none !important; }

    /* ---- typography ---- */
    h1,h2,h3,p{ margin:0; }
    .title-xl{ font-size:24px; font-weight:700; letter-spacing:-.01em; }
    .title-lg{ font-size:20px; font-weight:700; letter-spacing:-.01em; }
    .title-md{ font-size:15px; font-weight:600; }
    .subtext{ font-size:14px; color:var(--slate-500); }
    body.dark .subtext{ color:var(--slate-400); }
    .subtext-sm{ font-size:12px; color:var(--slate-400); }
    body.dark .subtext-sm{ color:var(--slate-500); }

    /* ---- buttons ---- */
    .btn{ border-radius:10px; font-weight:600; font-size:15px; padding:12px; border:1px solid transparent; transition:.15s; }
    .btn-primary{ background:var(--blue-600); color:#fff; }
    .btn-primary:hover{ background:var(--blue-700); }
    .btn-primary:disabled{ background:var(--emerald-50); color:var(--emerald-600); cursor:default; }
    .btn-secondary{ background:transparent; border:1px solid var(--slate-200); color:var(--slate-700); }
    .btn-secondary:hover{ background:var(--slate-50); }
    body.dark .btn-secondary{ border-color:var(--slate-700); color:var(--slate-200); }
    body.dark .btn-secondary:hover{ background:var(--slate-800); }
    .btn-link{ background:none; border:none; color:var(--blue-600); font-weight:600; font-size:14px; padding:0; }
    .btn-link:hover{ color:var(--blue-700); }
    .btn-sm{ font-size:12px; font-weight:600; padding:6px 12px; border-radius:8px; }
    .icon-btn{ background:none; border:none; padding:8px; border-radius:8px; color:var(--slate-500); }
    .icon-btn:hover{ background:var(--slate-50); }
    body.dark .icon-btn{ color:var(--slate-400); }
    body.dark .icon-btn:hover{ background:var(--slate-800); }

    /* ---- form fields ---- */
    label.field{ display:block; }
    .field-label{ font-size:14px; font-weight:500; display:block; margin-bottom:6px; }
    .field-input, select.field-input{
        width:100%; border:1px solid var(--slate-200); border-radius:10px; padding:12px 14px;
        font-size:15px; color:var(--slate-900); background:#fff; outline:none; transition:.15s;
    }
    .field-input::placeholder{ color:var(--slate-300); }
    .field-input:focus{ border-color:var(--slate-900); box-shadow:0 0 0 3px rgba(15,23,42,.05); }
    .field-input:disabled{ background:var(--slate-50); color:var(--slate-500); }
    body.dark .field-input{ background:var(--slate-800); border-color:var(--slate-700); color:var(--slate-100); }
    body.dark .field-input::placeholder{ color:var(--slate-500); }
    body.dark .field-input:focus{ border-color:var(--slate-500); }
    body.dark .field-input:disabled{ background:rgba(30,41,59,.5); color:var(--slate-400); }

    .pw-wrap{ position:relative; }
    .pw-toggle{ position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--slate-400); }
    .pw-toggle:hover{ color:var(--slate-600); }

    .search-wrap{ position:relative; }
    .search-wrap svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); pointer-events:none; }
    .search-wrap .field-input{ padding-left:36px; }

    /* ---- segmented tabs ---- */
    .segmented{ display:grid; grid-template-columns:1fr 1fr; gap:4px; background:var(--slate-100); border-radius:10px; padding:4px; margin-bottom:28px; }
    body.dark .segmented{ background:var(--slate-800); }
    .segmented button{ background:transparent; border:none; padding:8px; border-radius:8px; font-size:14px; font-weight:600; color:var(--slate-500); }
    .segmented button.active{ background:#fff; color:var(--blue-600); box-shadow:0 1px 2px rgba(0,0,0,.06); }
    body.dark .segmented button{ color:var(--slate-400); }
    body.dark .segmented button.active{ background:var(--slate-900); }
    .segmented button:disabled{ cursor:not-allowed; }

    /* ---- cards ---- */
    .card{ background:#fff; border:1px solid var(--slate-200); border-radius:var(--radius); }
    body.dark .card{ background:var(--slate-900); border-color:var(--slate-800); }
    .card-pad{ padding:16px; }
    .card-pad-lg{ padding:20px; }
    .clickable{ cursor:pointer; transition:.15s; }
    .clickable:hover{ border-color:var(--slate-300); box-shadow:0 1px 2px rgba(0,0,0,.04); }
    body.dark .clickable:hover{ border-color:var(--slate-700); }

    /* ---- avatars ---- */
    .avatar{ border-radius:999px; display:flex; align-items:center; justify-content:center; font-weight:600; flex-shrink:0; }
    .avatar.blue{ background:var(--blue-50); color:var(--blue-600); }
    .avatar.emerald{ background:var(--emerald-50); color:var(--emerald-600); }
    .avatar.amber{ background:var(--amber-50); color:var(--amber-600); }
    .avatar.violet{ background:var(--violet-50); color:var(--violet-600); }
    .avatar.rose{ background:var(--rose-50); color:var(--rose-600); }
    .avatar.slate{ background:var(--slate-100); color:var(--slate-600); }

    /* ---- badges/pills ---- */
    .pill{ display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px; }
    .pill-blue{ background:var(--blue-50); color:var(--blue-600); }
    .pill-emerald{ background:var(--emerald-50); color:var(--emerald-600); }
    .pill-amber{ background:var(--amber-50); color:var(--amber-600); }
    .pill-rose{ background:var(--rose-50); color:var(--rose-600); }
    .pill-slate{ background:var(--slate-100); color:var(--slate-500); }
    .chip{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; padding:4px 10px; border-radius:999px; background:var(--slate-100); color:var(--slate-600); }
    body.dark .chip{ background:var(--slate-800); color:var(--slate-300); }
    .chip button{ background:none; border:none; color:inherit; display:flex; }
    .chip button:hover{ color:var(--rose-500); }

    .rating{ display:flex; align-items:center; gap:4px; font-size:12px; font-weight:600; color:var(--amber-500); }

    /* ---- progress ---- */
    .progress-track{ height:8px; border-radius:999px; background:var(--slate-100); overflow:hidden; }
    body.dark .progress-track{ background:var(--slate-800); }
    .progress-fill{ height:100%; background:var(--blue-600); border-radius:999px; transition:width .2s; }

    /* ---- top nav ---- */
    .topnav{ position:sticky; top:0; z-index:20; background:#fff; border-bottom:1px solid var(--slate-200); }
    body.dark .topnav{ background:var(--slate-900); border-color:var(--slate-800); }
    .topnav-inner{ max-width:1152px; margin:0 auto; padding:0 32px; height:64px; display:flex; align-items:center; justify-content:space-between; }
    .brand{ font-size:18px; font-weight:700; color:var(--blue-600); letter-spacing:-.01em; }
    .navlinks{ display:flex; align-items:center; gap:4px; }
    .navlink{ position:relative; display:flex; align-items:center; gap:8px; background:none; border:none; padding:8px 12px; border-radius:8px; font-size:14px; font-weight:500; color:var(--slate-500); }
    .navlink:hover{ background:var(--slate-50); color:var(--slate-800); }
    body.dark .navlink{ color:var(--slate-400); }
    body.dark .navlink:hover{ background:var(--slate-800); color:var(--slate-200); }
    .navlink.active{ background:var(--blue-50); color:var(--blue-600); }
    .navlink .navbadge{ font-size:10px; font-weight:700; background:var(--blue-600); color:#fff; border-radius:999px; width:16px; height:16px; display:flex; align-items:center; justify-content:center; }
    .profile-pill{ display:flex; align-items:center; gap:10px; padding:6px 12px 6px 8px; border-radius:999px; border:1px solid transparent; background:none; }
    .profile-pill:hover{ background:var(--slate-50); }
    body.dark .profile-pill:hover{ background:var(--slate-800); }
    .profile-pill.active{ border-color:var(--blue-200); background:var(--blue-50); }

    /* ---- notifications dropdown ---- */
    .notif-wrap{ position:relative; }
    .notif-dot{ position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:999px; background:var(--rose-500); }
    .notif-panel{ position:absolute; right:0; margin-top:8px; width:288px; background:#fff; border:1px solid var(--slate-200); border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.12); overflow:hidden; }
    body.dark .notif-panel{ background:var(--slate-900); border-color:var(--slate-800); }
    .notif-header{ padding:12px 16px; border-bottom:1px solid var(--slate-200); display:flex; align-items:center; justify-content:space-between; font-size:14px; font-weight:600; }
    body.dark .notif-header{ border-color:var(--slate-800); }
    .notif-list{ max-height:280px; overflow-y:auto; }
    .notif-item{ padding:12px 16px; border-bottom:1px solid var(--slate-100); font-size:14px; }
    body.dark .notif-item{ border-color:var(--slate-800); }
    .notif-item:last-child{ border-bottom:none; }
    .notif-empty{ padding:24px 16px; text-align:center; font-size:14px; color:var(--slate-500); }

    /* ---- empty state ---- */
    .empty-state{ border:1px dashed var(--slate-200); border-radius:var(--radius); padding:56px 16px; text-align:center; }
    body.dark .empty-state{ border-color:var(--slate-800); }
    .empty-icon{ width:44px; height:44px; border-radius:999px; background:var(--slate-100); display:flex; align-items:center; justify-content:center; margin:0 auto 12px; color:var(--slate-500); }
    body.dark .empty-icon{ background:var(--slate-800); }

    /* ---- toast ---- */
    #toast{ position:fixed; bottom:24px; right:24px; z-index:50; background:var(--slate-900); color:#fff; font-size:14px; font-weight:500; padding:12px 16px; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.25); display:flex; align-items:center; gap:8px; opacity:0; transform:translateY(8px); transition:.2s; pointer-events:none; }
    #toast.show{ opacity:1; transform:translateY(0); }

    /* ---- misc ---- */
    .divider-row{ display:flex; align-items:center; gap:12px; margin:24px 0; }
    .divider-line{ flex:1; height:1px; background:var(--slate-200); }
    .bullet-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
    .bullet-list li{ font-size:14px; color:var(--slate-600); display:flex; gap:8px; }
    body.dark .bullet-list li{ color:var(--slate-400); }
    .bullet-list li::before{ content:""; width:4px; height:4px; border-radius:999px; background:var(--blue-600); margin-top:7px; flex-shrink:0; }
    .info-row{ display:flex; gap:12px; border:1px solid var(--slate-200); border-radius:12px; padding:12px; }
    body.dark .info-row{ border-color:var(--slate-800); }
    .info-row svg{ color:var(--slate-400); margin-top:2px; flex-shrink:0; }
    .filter-bar{ padding:16px; margin-bottom:24px; }
    .subtab-row{ display:flex; gap:4px; border-bottom:1px solid var(--slate-200); margin-bottom:24px; }
    body.dark .subtab-row{ border-color:var(--slate-800); }
    .subtab{ padding:10px 16px; font-size:14px; font-weight:500; background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-1px; color:var(--slate-500); }
    .subtab.active{ border-color:var(--blue-600); color:var(--blue-600); }
    body.dark .subtab{ color:var(--slate-400); }
    .upload-box{ width:100%; border:1px dashed var(--slate-200); border-radius:10px; padding:32px; display:flex; flex-direction:column; align-items:center; gap:8px; background:none; }
    .upload-box:hover{ background:var(--slate-50); }
    body.dark .upload-box{ border-color:var(--slate-700); }
    body.dark .upload-box:hover{ background:var(--slate-800); }
</style>
</head>

function jobById(id){ return JOBS.find(j=>j.id===Number(id)); }
function courseById(id){ return COURSES.find(c=>c.id===Number(id)); }
function coursesFor(job){ return job.courseIds.map(courseById).filter(Boolean); }
function matchPercent(job, skills){
    if(!skills || skills.length===0) return null;
    const lower = skills.map(s=>s.toLowerCase());
    const hits = job.skillsRequired.filter(s=>lower.includes(s.toLowerCase())).length;
    return Math.round((hits/job.skillsRequired.length)*100);
}

const JOB_LOCATIONS = ['All locations', ...new Set(JOBS.map(j=>j.location))];
const JOB_EXPERIENCE = ['All experience', ...new Set(JOBS.map(j=>j.experience))];
const JOB_TYPES = ['All types', ...new Set(JOBS.map(j=>j.employmentType))];
const JOB_DEPARTMENTS = ['All departments', ...new Set(JOBS.map(j=>j.department))];
const SALARY_BUCKETS = ['Any salary','Under ₹6L','₹6L – ₹10L','₹10L – ₹15L','₹15L+'];
function inSalaryBucket(job,b){
    if(b==='Any salary') return true;
    if(b==='Under ₹6L') return job.salaryMin<6;
    if(b==='₹6L – ₹10L') return job.salaryMax>=6 && job.salaryMin<=10;
    if(b==='₹10L – ₹15L') return job.salaryMax>=10 && job.salaryMin<=15;
    if(b==='₹15L+') return job.salaryMax>=15;
    return true;
}
const COURSE_LEVELS = ['All levels','Beginner','Intermediate','Advanced'];
const COURSE_DURATIONS = ['Any duration','Under 4 weeks','4–6 weeks','6+ weeks'];
const COURSE_PROVIDERS = ['All providers', ...new Set(COURSES.map(c=>c.provider))];
function inDurationBucket(c,b){
    if(b==='Any duration') return true;
    if(b==='Under 4 weeks') return c.durationWeeks<4;
    if(b==='4–6 weeks') return c.durationWeeks>=4 && c.durationWeeks<=6;
    if(b==='6+ weeks') return c.durationWeeks>6;
    return true;
}
function filterJobs(f){
    const q=(f.query||'').trim().toLowerCase();
    return JOBS.filter(j=>{
        const mq = !q || j.title.toLowerCase().includes(q) || j.company.toLowerCase().includes(q) || j.department.toLowerCase().includes(q);
        return mq &&
            (f.location===JOB_LOCATIONS[0] || j.location===f.location) &&
            (f.experience===JOB_EXPERIENCE[0] || j.experience===f.experience) &&
            (f.type===JOB_TYPES[0] || j.employmentType===f.type) &&
            (f.department===JOB_DEPARTMENTS[0] || j.department===f.department) &&
            inSalaryBucket(j, f.salary);
    });
}
function filterCourses(f){
    const q=(f.query||'').trim().toLowerCase();
    return COURSES.filter(c=>{
        const mq = !q || c.name.toLowerCase().includes(q) || c.provider.toLowerCase().includes(q);
        return mq &&
            (f.level===COURSE_LEVELS[0] || c.level===f.level) &&
            (f.provider===COURSE_PROVIDERS[0] || c.provider===f.provider) &&
            inDurationBucket(c, f.duration);
    });
}

/* ============ TOAST / NOTIFY ============ */
let toastTimer=null;
function showToast(msg){
    const el = document.getElementById('toast');
    el.innerHTML = ICON.check + '<span>' + esc(msg) + '</span>';
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>el.classList.remove('show'), 3000);
}
function notify(msg){
    showToast(msg);
    state.notifications.unshift({id:Date.now(), message:msg, time:'Just now'});
    state.notifications = state.notifications.slice(0,20);
    state.unread++;
}

function attachAuthFlowEvents(){
    document.querySelectorAll('[data-bind]').forEach(el=>{
        el.addEventListener('input', e=>{
            const key = el.getAttribute('data-bind').replace('d_','');
            state.details[key] = e.target.value;
        });
    });
    const le = document.getElementById('loginEmail'); if(le) le.addEventListener('input', e=>state.login.email=e.target.value);
    const lp = document.getElementById('loginPassword'); if(lp) lp.addEventListener('input', e=>state.login.password=e.target.value);
    const sn = document.getElementById('signupName'); if(sn) sn.addEventListener('input', e=>state.signup.name=e.target.value);
    const se = document.getElementById('signupEmail'); if(se) se.addEventListener('input', e=>state.signup.email=e.target.value);
    const sph = document.getElementById('signupPhone'); if(sph) sph.addEventListener('input', e=>state.signup.phone=e.target.value);
    const sp = document.getElementById('signupPassword'); if(sp) sp.addEventListener('input', e=>state.signup.password=e.target.value);
    const sc = document.getElementById('signupConfirm'); if(sc) sc.addEventListener('input', e=>state.signup.confirm=e.target.value);

    document.querySelectorAll('.pw-toggle').forEach(btn=>{
        btn.addEventListener('click', ()=>{
            const key = btn.getAttribute('data-pw');
            const inputId = key==='login'?'loginPassword':key==='signup'?'signupPassword':'signupConfirm';
            const input = document.getElementById(inputId);
            const showing = input.type==='text';
            input.type = showing ? 'password' : 'text';
            btn.innerHTML = showing ? ICON.eye : ICON.eyeOff;
        });
    });
}

function goScreen(s){ state.screen=s; render(); }
function goDetailsStep(n){ if(n===1 || state.detailsStep===2){ state.detailsStep=n; render(); } }
function nextDetailsStep(){ state.detailsStep=2; render(); }
function handleAuthSubmit(){
    const isLogin = state.authMode==='login';
    state.details.fullName = state.details.fullName || state.signup.name || '';
    state.details.email = state.details.email || (isLogin ? state.login.email : state.signup.email);

/* ============ APP SHELL ============ */
function renderAppShell(){
    return renderTopNav() + '<div id="mainContent">' + renderMainContent() + '</div>';
}

function renderTopNav(){
    const savedCount = state.bookmarkedJobs.size + state.bookmarkedCourses.size;
    const items = [
        {key:'home', label:'Home', icon:ICON.home},
        {key:'network', label:'Network', icon:ICON.users},
        {key:'job', label:'Job', icon:ICON.briefcase},
        {key:'course', label:'Course', icon:ICON.grad},
        {key:'search', label:'Search', icon:ICON.search},
        {key:'saved', label:'Saved', icon:ICON.bookmark.replace('{FILL}','none'), badge:savedCount},

        const active = !state.profileOpen && state.activeTab===it.key;
        return `<button class="navlink ${active?'active':''}" onclick="changeTab('${it.key}')">${it.icon}<span>${it.label}</span>${it.badge?`<span class="navbadge">${it.badge}</span>`:''}</button>`;

function renderNotifList(){
    if(state.notifications.length===0) return '<div class="notif-empty">No notifications yet</div>';
    return state.notifications.map(n=>`<div class="notif-item"><div>${esc(n.message)}</div><div class="subtext-sm mt-1">${n.time}</div></div>`).join('');

function renderMainContent(){
    if(state.profileOpen) return renderProfileTab();
    if(state.selectedJobId) return renderJobDetail(jobById(state.selectedJobId));
    if(state.selectedCourseId) return renderCourseDetail(courseById(state.selectedCourseId));
    if(state.activeTab==='home') return renderHomeTab();
    if(state.activeTab==='network') return renderNetworkTab();
    if(state.activeTab==='job') return renderJobTab();
    if(state.activeTab==='course') return renderCourseTab();
    if(state.activeTab==='search') return renderSearchTab();
    if(state.activeTab==='saved') return renderSavedTab();

function attachAppShellEvents(){
    attachJobGridEvents();
    attachCourseGridEvents();

function changeTab(tab){ state.selectedJobId=null; state.selectedCourseId=null; state.profileOpen=false; state.notifOpen=false; state.activeTab=tab; render(); }
function openProfile(){ state.selectedJobId=null; state.selectedCourseId=null; state.profileOpen=true; state.notifOpen=false; render(); }
function toggleDark(){ state.dark=!state.dark; render(); }
function toggleNotif(){ state.notifOpen=!state.notifOpen; state.unread=0; document.getElementById('notifPanel').classList.toggle('hidden', !state.notifOpen); document.getElementById('notifPanel').innerHTML = renderNotifList()==='' ? '' : document.getElementById('notifPanel').innerHTML; render(); }

    bindFilterGroup('jobTab', state.jobTabFilters, 'job', 'jobTabGrid');
    bindFilterGroup('searchJob', state.searchJobFilters, 'job', 'searchGrid');

function attachCourseGridEvents(){
    bindFilterGroup('courseTab', state.courseTabFilters, 'course', 'courseTabGrid');
    bindFilterGroup('searchCourse', state.searchCourseFilters, 'course', 'searchGrid');
}
function attachSearchInputEvents(){ /* handled via bindFilterGroup calls above when relevant tab renders */ }

function bindFilterGroup(prefix, filtersObj, kind, gridId){
    const gridEl = document.getElementById(gridId);
    if(!gridEl) return;
    const qEl = document.getElementById(prefix+'Query');
    if(qEl) qEl.addEventListener('input', e=>{ filtersObj.query = e.target.value; refreshGrid(); });
    const fieldsJob = ['Location','Experience','Type','Department','Salary'];
    const fieldsCourse = ['Level','Duration','Provider'];
    const fields = kind==='job' ? fieldsJob : fieldsCourse;
    fields.forEach(fname=>{
        const el = document.getElementById(prefix+fname);
        if(el) el.addEventListener('change', e=>{ filtersObj[fname.toLowerCase()] = e.target.value; refreshGrid(); });
    });
    function refreshGrid(){
        const el = document.getElementById(gridId);
        if(!el) return;
        el.innerHTML = kind==='job' ? renderJobGrid(filtersObj) : renderCourseGrid(filtersObj);
    }
}

function toggleBookmarkJob(id){
    const job = jobById(id);
    if(state.bookmarkedJobs.has(id)){ state.bookmarkedJobs.delete(id); }
    else { state.bookmarkedJobs.add(id); notify(`Saved ${job.title} at ${job.company}`); }

function applyToJob(id){
    if(state.appliedJobs[id]) return;

    notify(`Applied to ${job.title} at ${job.company}`);
    render();
}

    const job = jobById(id);
    state.appliedJobs[id] = status;
    notify(`${job.title} status updated to ${status}`);
    render();
}

        <button class="btn-link mb-6" style="display:flex;align-items:center;gap:6px;color:var(--slate-500);" onclick="closeCourseDetail()">${ICON.back}Back</button>
        <div class="grid-2" style="grid-template-columns:2fr 1fr;gap:32px;align-items:start;">
            <div class="flex-col gap-4">
                <div class="justify-between items-center">
                    <div class="flex items-center gap-4">
                        <div class="avatar ${course.tone}" style="width:56px;height:56px;font-size:20px;">${initials(course.name)}</div>
                        <div><h1 class="title-lg">${esc(course.name)}</h1><p class="subtext mt-1">${esc(course.provider)} · Instructor ${esc(course.instructor)}</p></div>
                    </div>
                    <button class="icon-btn" style="border:1px solid ${bookmarked?'var(--blue-200)':'var(--slate-200)'};background:${bookmarked?'var(--blue-50)':'none'};color:${bookmarked?'var(--blue-600)':'var(--slate-500)'};" onclick="toggleBookmarkCourse(${course.id})">${bmk(bookmarked)}</button>
                </div>

                <div class="grid-3">
                    <div class="info-row">${ICON.clock}<div><p class="subtext-sm">Duration</p><p style="font-size:14px;margin-top:2px;">${course.durationWeeks} weeks</p></div></div>
                    <div class="info-row">${ICON.target}<div><p class="subtext-sm">Level</p><p style="font-size:14px;margin-top:2px;">${esc(course.level)}</p></div></div>
                    <div class="info-row">${ICON.star}<div><p class="subtext-sm">Rating</p><p style="font-size:14px;margin-top:2px;">${course.rating} / 5</p></div></div>
                </div>

                <div class="card card-pad">
                    <p class="subtext-sm mb-2">About this course</p>
                    <p style="font-size:14px;line-height:1.6;">${esc(course.description)}</p>
                </div>

                <div class="card card-pad">
                    <p class="title-md mb-3">What you'll learn</p>
                    <ul class="bullet-list">${course.skillsGained.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
                </div>

                <div class="flex gap-3">${cta}</div>
            </div>

            <div class="flex-col gap-5">
                <div class="card card-pad">
                    <p class="subtext-sm mb-3">Provider</p>
                    <div class="flex items-center gap-3"><div class="avatar ${course.tone}" style="width:44px;height:44px;">${initials(course.provider)}</div><div><p class="title-md">${esc(course.provider)}</p><p class="subtext" style="font-size:12px;">${esc(course.instructor)}</p></div></div>
                </div>
                <div class="card card-pad">
                    <p class="subtext-sm mb-3">Price</p>
                    <p class="title-lg">${course.price}</p>
                </div>
            </div>
        </div>
    </div>`;
}

/* ============ COURSE TAB ============ */
function renderCourseTab(){
    return `<div class="container">
        <div class="mb-5"><h2 class="title-lg">Courses</h2><p class="subtext mt-1">Recommended to help you land the role.</p></div>
        ${filterBarHtml(state.courseTabFilters,'course','courseTab')}
        <div id="courseTabGrid">${renderCourseGrid(state.courseTabFilters)}</div>
    </div>`;
}
function renderCourseGrid(f){
    const results = filterCourses(f);
    if(results.length===0) return emptyStateHtml(ICON.grad,'No courses match your filters','Try a different search.');
    return '<div class="grid-3">' + results.map(c=>courseCardHtml(c)).join('') + '</div>';
}
function toggleBookmarkCourse(id){
    const course = courseById(id);
    if(state.bookmarkedCourses.has(id)){ state.bookmarkedCourses.delete(id); }
    else { state.bookmarkedCourses.add(id); notify(`Saved ${course.name}`); }
    render();
}
function enrollCourse(id){
    if(state.courseProgress[id] !== undefined) return;
    const course = courseById(id);
    state.courseProgress[id] = 0;
    notify(`Enrolled in ${course.name}`);
    render();
}
function bumpCourse(id, delta){
    const current = state.courseProgress[id] || 0;
    const next = Math.min(100, current+delta);
    state.courseProgress[id] = next;
    if(next===100 && current!==100){ const c = courseById(id); notify(`Completed ${c.name} 🎉`); }
    render();
}

/* ============ SEARCH TAB ============ */
function renderSearchTab(){
    const isJob = state.searchMode==='job';
    return `<div class="container">
        <div class="mb-5"><h2 class="title-lg">Search</h2><p class="subtext mt-1">Find jobs or courses in one place.</p></div>
        <div class="segmented" style="max-width:320px;">
            <button class="${isJob?'active':''}" onclick="setSearchMode('job')">Jobs</button>
            <button class="${!isJob?'active':''}" onclick="setSearchMode('course')">Courses</button>
        </div>
        ${isJob ? filterBarHtml(state.searchJobFilters,'job','searchJob') : filterBarHtml(state.searchCourseFilters,'course','searchCourse')}
        <div id="searchGrid">${isJob ? renderJobGrid(state.searchJobFilters) : renderCourseGrid(state.searchCourseFilters)}</div>
    </div>`;
}
function setSearchMode(m){ state.searchMode=m; render(); }

/* ============ SAVED / TRACKER ============ */
function renderSavedTab(){
    const savedJobs = JOBS.filter(j=>state.bookmarkedJobs.has(j.id));
    const savedCourses = COURSES.filter(c=>state.bookmarkedCourses.has(c.id));
    const appliedIds = Object.keys(state.appliedJobs);
    const enrolledIds = Object.keys(state.courseProgress);
    const sub = state.savedSub;

    let body = '';
    if(sub==='jobs'){
        body = savedJobs.length===0
            ? emptyStateHtml(ICON.bookmark.replace('{FILL}','none'),'No saved jobs yet','Bookmark jobs from the Job or Search tab.')
            : '<div class="grid-2">' + savedJobs.map(j=>jobCardHtml(j)).join('') + '</div>';
    } else if(sub==='courses'){
        body = savedCourses.length===0
            ? emptyStateHtml(ICON.bookmark.replace('{FILL}','none'),'No saved courses yet','Bookmark courses from the Course or Search tab.')
            : '<div class="grid-3">' + savedCourses.map(c=>courseCardHtml(c)).join('') + '</div>';
    } else {
        body = `<div class="grid-2">
            <div>
                <p class="title-md flex items-center gap-2 mb-3">${ICON.trend}Job applications</p>
                ${appliedIds.length===0 ? emptyStateHtml(ICON.briefcase,'No applications yet','Apply to a job to track its status here.') :
                    appliedIds.map(id=>{
                        const job = jobById(id);
                        if(!job) return '';
                        return `<div class="card card-pad flex items-center gap-3 mb-3">
                            <div class="avatar ${job.tone}" style="width:40px;height:40px;">${initials(job.company)}</div>
                            <div style="min-width:0;flex:1;"><p class="title-md truncate">${esc(job.title)}</p><p class="subtext truncate" style="font-size:12px;">${esc(job.company)}</p></div>
                            <select class="field-input" style="width:auto;padding:6px 8px;font-size:12px;font-weight:600;" onchange="updateJobStatus(${job.id}, this.value)">
                                ${STATUS_OPTIONS.map(s=>`<option value="${s}" ${s===state.appliedJobs[id]?'selected':''}>${s}</option>`).join('')}
                            </select>
                        </div>`;
                    }).join('')
                }
            </div>
            <div>
                <p class="title-md flex items-center gap-2 mb-3">${ICON.grad}Course completion</p>
                ${enrolledIds.length===0 ? emptyStateHtml(ICON.grad,'No courses in progress','Enroll in a course to track completion here.') :
                    enrolledIds.map(id=>{
                        const course = courseById(id);
                        if(!course) return '';
                        const progress = state.courseProgress[id];
                        return `<div class="card card-pad mb-3">
                            <div class="flex items-center gap-3 mb-3">
                                <div class="avatar ${course.tone}" style="width:40px;height:40px;">${initials(course.name)}</div>
                                <div style="min-width:0;flex:1;"><p class="title-md truncate">${esc(course.name)}</p><p class="subtext truncate" style="font-size:12px;">${esc(course.provider)}</p></div>
                                <span style="font-weight:600;">${progress}%</span>
                            </div>
                            <div class="progress-track"><div class="progress-fill" style="width:${progress}%;"></div></div>
                            <button class="btn-sm btn-secondary w-full mt-3" style="border-color:var(--blue-200);color:var(--blue-600);" ${progress>=100?'disabled':''} onclick="bumpCourse(${course.id},10)">${progress>=100?'Completed':'+10% progress'}</button>
                        </div>`;
                    }).join('')
                }
            </div>
        </div>`;
    }

    return `<div class="container">
        <div class="mb-5"><h2 class="title-lg">Saved & Tracker</h2><p class="subtext mt-1">Everything you've bookmarked, applied to, or started.</p></div>
        <div class="subtab-row">
            <button class="subtab ${sub==='jobs'?'active':''}" onclick="setSavedSub('jobs')">Saved Jobs (${savedJobs.length})</button>
            <button class="subtab ${sub==='courses'?'active':''}" onclick="setSavedSub('courses')">Saved Courses (${savedCourses.length})</button>
            <button class="subtab ${sub==='tracker'?'active':''}" onclick="setSavedSub('tracker')">Tracker</button>
        </div>
        ${body}
    </div>`;
}
function setSavedSub(s){ state.savedSub=s; render(); }

/* ============ PROFILE TAB ============ */
function renderProfileTab(){
    const editing = state.profileEditing;
    return `<div class="container" style="max-width:768px;">
        <button class="btn-link mb-6" style="display:flex;align-items:center;gap:6px;color:var(--slate-500);" onclick="closeProfile()">${ICON.back}Back</button>
        <div class="justify-between items-center mb-7">
            <div class="flex items-center gap-4">
                <div class="avatar blue" style="width:56px;height:56px;font-size:20px;">${initials(state.details.fullName||'You')}</div>
                <div><h1 class="title-lg">${esc(state.details.fullName || 'Your profile')}</h1><p class="subtext">${esc(state.details.qualification || 'Add your qualification')}</p></div>
            </div>
            <button class="btn-sm" style="display:flex;align-items:center;gap:6px;border:1px solid ${editing?'var(--blue-600)':'var(--slate-200)'};background:${editing?'var(--blue-50)':'none'};color:${editing?'var(--blue-600)':'var(--slate-700)'};padding:8px 16px;" onclick="toggleProfileEdit()">
                ${editing?ICON.save:ICON.pencil}${editing?'Done editing':'Edit profile'}
            </button>
        </div>

        <div class="grid-2 mb-6">
            <div class="card card-pad-lg flex-col gap-4">
                <p class="title-md">Personal details</p>
                ${profileField('Full Name','p_fullName',state.details.fullName,editing)}
                ${profileField('Phone Number','p_phone',state.details.phone,editing)}
                ${profileField('Email','p_email',state.details.email,editing)}
                ${profileField('LinkedIn','p_linkedin',state.details.linkedin,editing)}
                ${profileField('Address','p_address',state.details.address,editing)}
            </div>
            <div class="card card-pad-lg flex-col gap-4">
                <p class="title-md">Qualification</p>
                ${profileField('SSC Marks','p_sscMarks',state.details.sscMarks,editing)}
                ${profileField('HSC Marks','p_hscMarks',state.details.hscMarks,editing)}
                ${profileField('Degree','p_degree',state.details.degree,editing)}
                ${profileField('Qualification','p_qualification',state.details.qualification,editing)}
                ${profileField('Specification','p_specialization',state.details.specialization,editing)}
            </div>
        </div>

        <div class="card card-pad-lg mb-6">
            <p class="title-md mb-1">Skills</p>
            <p class="subtext-sm mb-3">Add skills so we can show a match score on jobs that need them.</p>
            <div class="flex gap-2 mb-3" style="flex-wrap:wrap;">
                ${state.skills.length===0 ? '<p class="subtext-sm">No skills added yet.</p>' :
                    state.skills.map(s=>`<span class="chip">${esc(s)}${editing?`<button onclick="removeSkill('${esc(s).replace(/'/g,"\\'")}')">${ICON.x}</button>`:''}</span>`).join('')}
            </div>
            ${editing ? `
                <div class="flex gap-2">
                    <input class="field-input" id="skillInput" placeholder="e.g. React, SQL, Figma" />
                    <button class="btn-sm btn-primary" style="display:flex;align-items:center;gap:4px;padding:0 14px;" onclick="addSkillFromInput()">${ICON.plus}Add</button>
                </div>` : ''}
        </div>

        <div class="card card-pad-lg">
            <p class="title-md mb-1">Resume</p>
            <p class="subtext-sm mb-3">Upload your resume so recruiters can review it.</p>
            ${renderResumeSection()}
            <input type="file" id="resumeInput" accept=".pdf,image/*" class="hidden" />
        </div>
    </div>`;
}
function profileField(label,id,value,editing){
    return `<label class="field"><span class="field-label">${label}</span><input class="field-input" data-bind="${id}" value="${esc(value)}" ${editing?'':'disabled'} /></label>`;
}
function renderResumeSection(){
    if(state.resume){
        const r = state.resume;
        const isImg = r.type.startsWith('image/');
        const isPdf = r.type==='application/pdf';
        let preview = `<p class="subtext-sm">Preview isn't available for this file type.</p>`;
        if(isImg) preview = `<img src="${r.url}" style="width:100%;max-height:280px;object-fit:contain;border-radius:10px;border:1px solid var(--slate-200);" />`;
        else if(isPdf) preview = `<embed src="${r.url}" type="application/pdf" style="width:100%;height:280px;border-radius:10px;border:1px solid var(--slate-200);" />`;
        return `
            <div class="flex items-center gap-3 card card-pad mb-3">
                ${isImg?ICON.image:ICON.file}
                <div style="min-width:0;flex:1;"><p style="font-size:14px;font-weight:500;" class="truncate">${esc(r.name)}</p><p class="subtext-sm">${Math.round(r.size/1024)} KB</p></div>
                <button class="btn-link" style="color:var(--rose-500);" onclick="removeResume()">Remove</button>
            </div>
            ${preview}
        `;
    }
    return `<button class="upload-box" onclick="document.getElementById('resumeInput').click()">${ICON.upload}<span style="font-size:14px;font-weight:500;">Click to upload your resume</span><span class="subtext-sm">PDF or image, up to a few MB</span></button>`;
}

function closeProfile(){ state.profileOpen=false; render(); }
function toggleProfileEdit(){ state.profileEditing = !state.profileEditing; render(); }
function addSkillFromInput(){
    const input = document.getElementById('skillInput');
    if(!input) return;
    const val = input.value.trim();
    if(!val) return;
    if(!state.skills.some(s=>s.toLowerCase()===val.toLowerCase())) state.skills.push(val);
    render();
}
function removeSkill(skill){ state.skills = state.skills.filter(s=>s!==skill); render(); }
function removeResume(){ if(state.resume) URL.revokeObjectURL(state.resume.url); state.resume=null; render(); }

function attachProfileEvents(){
    document.querySelectorAll('[data-bind^="p_"]').forEach(el=>{
        el.addEventListener('input', e=>{
            const key = el.getAttribute('data-bind').replace('p_','');
            state.details[key] = e.target.value;
        });
    });
    const skillInput = document.getElementById('skillInput');
    if(skillInput) skillInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addSkillFromInput(); } });
    const resumeInput = document.getElementById('resumeInput');
    if(resumeInput) resumeInput.addEventListener('change', e=>{
        const file = e.target.files && e.target.files[0];
        if(!file) return;
        if(state.resume) URL.revokeObjectURL(state.resume.url);
        const url = URL.createObjectURL(file);
        state.resume = {name:file.name, size:file.size, type:file.type, url};
        notify('Resume uploaded');
        render();
    });
}

/* ============ INIT ============ */
render();
</script>
</body>
</html>
